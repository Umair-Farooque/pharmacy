<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Hafiz Pharmacy - Connection Status</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .error-card {
      background: #ffffff;
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--gray-200);
      padding: 36px 32px;
      text-align: center;
    }

    .icon-badge {
      font-size: 54px;
      margin-bottom: 16px;
      display: inline-block;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .checklist-box {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .checklist-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--gray-600);
    }

    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checklist li span.bullet {
      color: var(--danger);
      font-weight: bold;
    }

    .error-details {
      background: var(--danger-light);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--danger);
      word-break: break-all;
      text-align: left;
    }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--gray-700);
      border: 1.5px solid var(--gray-300);
    }

    .btn-secondary:hover {
      background: var(--gray-100);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 12px;
      color: var(--gray-600);
      margin-top: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div id="iconBadge" class="icon-badge">⚠️</div>
    <h1 id="errorTitle" class="card-title">Connection Failed</h1>
    <p id="errorSubtitle" class="card-subtitle">Could not connect to the pharmacy system.</p>

    <div id="errorDetailsBox" class="error-details" style="display: none;"></div>

    <div class="checklist-box">
      <div id="checklistTitle" class="checklist-title">Troubleshooting Checklist</div>
      <ul id="checklistItems" class="checklist">
        <li><span class="bullet">•</span> <span>MySQL is not installed or not running.</span></li>
        <li><span class="bullet">•</span> <span>MySQL root password is incorrect.</span></li>
        <li><span class="bullet">•</span> <span>Port 3000 is already in use by another application.</span></li>
      </ul>
    </div>

    <div class="btn-row">
      <button id="retryBtn" class="btn btn-primary" onclick="handleRetry()">
        🔄 Retry Connection
      </button>
      <button id="setupBtn" class="btn btn-secondary" onclick="handleOpenSetup()">
        ⚙️ Open Setup / Settings
      </button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'server';
    const serverUrl = params.get('serverUrl') || '';
    const rawError = params.get('error') || '';

    const errorTitle = document.getElementById('errorTitle');
    const errorSubtitle = document.getElementById('errorSubtitle');
    const checklistTitle = document.getElementById('checklistTitle');
    const checklistItems = document.getElementById('checklistItems');
    const errorDetailsBox = document.getElementById('errorDetailsBox');
    const statusMsg = document.getElementById('statusMsg');

    if (rawError) {
      errorDetailsBox.style.display = 'block';
      errorDetailsBox.textContent = 'Details: ' + rawError;
    }

    if (mode === 'client') {
      errorTitle.textContent = 'Cannot Connect to Server PC';
      errorSubtitle.textContent = 'Could not reach the Server PC at: ' + (serverUrl || 'specified IP address');
      checklistTitle.textContent = 'Please check the following:';
      checklistItems.innerHTML = `
        <li><span class="bullet">•</span> <span><strong>Server PC:</strong> Is it turned on and is Al-Hafiz Pharmacy open on it?</span></li>
        <li><span class="bullet">•</span> <span><strong>Network:</strong> Are both computers connected to the same Wi-Fi or router?</span></li>
        <li><span class="bullet">•</span> <span><strong>Firewall:</strong> Is Windows Firewall on the Server PC allowing port 3000?</span></li>
        <li><span class="bullet">•</span> <span><strong>IP Address:</strong> Has the Server PC's IP address changed? Click "Open Setup" to update it.</span></li>
      `;
    } else {
      errorTitle.textContent = 'Server PC - Database Error';
      errorSubtitle.textContent = 'The local pharmacy server could not connect to MySQL.';
      checklistTitle.textContent = 'Please check the following:';
      checklistItems.innerHTML = `
        <li><span class="bullet">•</span> <span><strong>MySQL Service:</strong> Ensure MySQL is running in Windows Services or XAMPP.</span></li>
        <li><span class="bullet">•</span> <span><strong>Credentials:</strong> Verify the MySQL root password matches your setup.</span></li>
        <li><span class="bullet">•</span> <span><strong>Port Conflict:</strong> Port 3000 or 3306 might be used by another app.</span></li>
        <li><span class="bullet">•</span> <span>Click <strong>"Open Setup"</strong> below to test or fix your database password.</span></li>
      `;
    }

    async function handleRetry() {
      const btn = document.getElementById('retryBtn');
      btn.disabled = true;
      statusMsg.textContent = 'Retrying connection...';

      try {
        if (window.electronAPI && window.electronAPI.retryConnection) {
          const res = await window.electronAPI.retryConnection();
          if (res && !res.success) {
            statusMsg.textContent = 'Retry failed: ' + (res.error || 'Server still unreachable');
            btn.disabled = false;
          }
        } else if (window.electronAPI && window.electronAPI.restartApp) {
          window.electronAPI.restartApp();
        } else {
          window.location.reload();
        }
      } catch (err) {
        statusMsg.textContent = 'Error: ' + err.message;
        btn.disabled = false;
      }
    }

    function handleOpenSetup() {
      if (window.electronAPI && window.electronAPI.openSetup) {
        window.electronAPI.openSetup();
      } else {
        window.location.href = 'setup.html';
      }
    }
  </script>
</body>
</html>
