appId: com.pharmacy.management
productName: Pharmacy Management System
directories:
  output: dist
  buildResources: public
files:
  - electron.js
  - preload.js
  - src/**/*
  - public/**/*
  - node_modules/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pharmacy Management
